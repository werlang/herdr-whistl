name: Record goldens

# Records the screenshot reference images on macOS and publishes them as an artifact.
#
# Goldens are only comparable on the platform they were recorded on, so they cannot be recorded on a Linux
# developer box. When no Mac is available, dispatch this workflow for the branch under work, download the
# artifact, commit the PNGs and let CI verify them.
#
#   gh workflow run goldens.yml --ref <branch>
#   gh run watch <run-id> && gh run download <run-id> -n goldens -D /tmp/goldens
#   cp -r /tmp/goldens/* app/src/test/screenshots/ && git add ... && git commit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Record screenshots
        run: ./gradlew --no-daemon recordRoborazziDebug

      - uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: app/src/test/screenshots/
          if-no-files-found: error
