# The build container has ~4 GB: keep Gradle and Kotlin inside it.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 runs unit tests only for the tested build type by default; keep the release variant's unit tests in check (8.x parity).
android.onlyEnableUnitTestForTheTestedBuildType=false
