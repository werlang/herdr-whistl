# Single source of truth for the app version.
#
# versionName is SemVer: MAJOR.MINOR.PATCH.
# versionCode is computed from it in app/build.gradle.kts as
#   MAJOR * 10000 + MINOR * 100 + PATCH
# so it is always monotonic and never has to be remembered by hand. 0.1.0 -> 100,
# 0.2.0 -> 200, 1.3.7 -> 10307.
#
# Bumping versionName changes the string the About panel renders, so the
# screenshot goldens that contain it must be re-recorded in the same commit
# (macOS only, see CONTRIBUTING.md).
versionName=0.5.8
